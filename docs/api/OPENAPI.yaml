openapi: 3.1.0
info:
  title: Authority Runtime API
  version: "1.3.0"
  summary: >
    The public contract between an external agent (or anything acting on its
    behalf — an ordinary HTTP client, the official SDKs, or the MCP bridge)
    and Authority's gateway. This file is the single source of truth for
    request/response shapes; docs/api/RUNTIME_API.md is kept in sync with it
    in prose form.
  description: |
    ## Reading this spec

    Every path and schema below carries an `x-status` extension:

    - `stable` — implemented today, exactly as described. Changing one of
      these is a breaking change and requires an explicit version bump.
    - `planned` — part of this roadmap, not yet implemented. Included now so
      the whole surface — ordinary HTTP clients, the TypeScript/Python SDKs,
      and the MCP bridge — is designed against one contract from day one,
      per "Phase 1: inspect and define the public API." A `planned` path
      returns `501 NOT_IMPLEMENTED` with the standard error envelope until
      its own PR lands; this spec is updated in the same commit that
      implements it.

    ## The three things this API deliberately keeps separate

    - **Agent credential** (`authority_rk_...`) — identifies a registered
      agent. Proves *who is calling*, nothing else. Works on every endpoint
      below, for any of that agent's tasks -- unless the task's application
      requires task sessions, in which case it is refused with
      `403 TASK_SESSION_REQUIRED` (except for opening a session). This
      setting is independent of task alignment and of any AI review.
    - **Task session** (`authority_ts_...`) — an optional, short-lived
      (≤15 minutes) stand-in for the agent credential, scoped to one task and
      the contract version active when it was created. It exists so a client
      doesn't have to re-send the long-lived credential on every call — it
      grants no tool authority of its own and is resolved through the exact
      same check a credential is on every `/authorize` or `/execute` call.
    - **Capability** (`authcap_v1_...`) — the only thing that ever authorizes
      one exact operation, resource, and argument set, for a short time, a
      bounded number of uses. Every protected call is authorized
      independently; nothing upstream of a capability is an enforcement
      boundary.

    `GET /tasks/{taskId}/tools` returns a contract-filtered list of what's
    currently callable. It reduces mistakes and attack surface for a client
    choosing what to ask for, but it is never itself the thing that decides
    whether a call is allowed — `POST /authorize` is, for every call, whether
    or not it was listed.
  license:
    name: Proprietary
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: "http://localhost:3000"
        description: "e.g. https://authority-d2zf.onrender.com for the hosted pilot deployment."

security:
  - agentCredential: []

tags:
  - name: health
    description: Unauthenticated liveness/readiness.
  - name: authorization
    description: The core authorize-then-execute protocol.
  - name: capabilities
    description: Capability consumption and revocation.
  - name: connectors
    description: Server-executed external operations.
  - name: approvals
    description: Human-in-the-loop approval status.
  - name: sessions
    description: Task-bound sessions — an optional, short-lived stand-in for the agent credential.
  - name: manifests
    description: Contract-filtered tool manifests.
  - name: alignment
    description: >
      Optional task alignment: objectives and external-content screening.
      Off for every application until enabled; plan and per-call checks run
      inside /tasks/{taskId}/prepare and /authorize without any of these calls.
  - name: customers
    description: >
      The developer API: an application backend creates its own external
      customers, opens or registers their provider connections, and starts
      tasks on their behalf. Authenticated by a backend credential, never an
      agent credential, task session, or dashboard login.
  - name: tasks
    description: >
      The developer API's task lifecycle: submit a candidate plan and get a
      running contract back, without a dashboard click, for tasks eligible
      for bounded automatic activation (see /tasks/{taskId}/prepare).
      Authenticated by a backend credential, same as the customers group.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness
      tags: [health]
      x-status: stable
      security: []
      responses:
        "200":
          description: The process is up. Touches no dependency.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
                  commit:
                    type: string
                    description: Truncated, non-secret deploy commit SHA, present only on Render.

  /ready:
    get:
      operationId: getReady
      summary: Readiness
      tags: [health]
      x-status: stable
      security: []
      responses:
        "200":
          description: The gateway can reach its database and the schema matches this build.
          content:
            application/json:
              schema:
                type: object
                required: [status, github, tls, schema]
                properties:
                  status: { const: ready }
                  github: { type: string, enum: [disabled, mock, live] }
                  tls: { type: string, enum: [verified, unverified_local] }
                  schema: { const: current }
        "503":
          description: Not ready. Deliberately names no host, role, version, or error detail.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: not_ready }
                  gateway: { type: string, enum: [not_configured, unreachable, tls_unverified, ok] }
                  schema: { const: mismatch }
                  github: { const: misconfigured }

  /authorize:
    post:
      operationId: authorize
      summary: Authorize one tool call and, if permitted, issue a capability
      tags: [authorization]
      x-status: stable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeRequest" }
      responses:
        "200":
          description: >
            A decision — including a deny. Authorization never raises an
            error for a refusal; refusals are normal 200 responses.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AgentTaskMismatch" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /capabilities/consume:
    post:
      operationId: consumeCapability
      summary: Simulated consumption of a capability (tools with no live connector)
      tags: [capabilities]
      x-status: stable
      description: >
        Validates the call against the capability exactly as a real executor
        would, then calls nothing external. Tools with a real connector are
        executed via `POST /execute` instead, whose response says
        `simulation: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumeCapabilityRequest" }
      responses:
        "200":
          description: Accepted (possibly a replay).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumeCapabilityResponse" }
        "403": { $ref: "#/components/responses/ScopeMismatch" }
        "404": { $ref: "#/components/responses/CapabilityNotFound" }
        "409": { $ref: "#/components/responses/CapabilityConflict" }

  /capabilities/revoke:
    post:
      operationId: revokeCapability
      summary: Revoke a capability the calling agent holds
      tags: [capabilities]
      x-status: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilityId, reason]
              additionalProperties: false
              properties:
                capabilityId: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Revoked (possibly already revoked — idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [result, capabilityId]
                properties:
                  result: { type: string, enum: [revoked, already_revoked] }
                  capabilityId: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/CapabilityNotFound" }
        "409":
          description: CAPABILITY_ALREADY_USED — a fully used capability cannot be revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /github/execute:
    post:
      operationId: executeGithub
      summary: "Execute a github.* operation through Authority's GitHub connector"
      tags: [connectors]
      x-status: stable
      description: >
        Preserved exactly as-is for backward compatibility. New connectors
        (Custom API, Stripe, Gmail, Slack, PostgreSQL) are reached through the
        generic `POST /execute` below instead of one route per connector;
        this route is not deprecated, just no longer the pattern new
        connectors follow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExecuteSucceeded" }
        "403": { $ref: "#/components/responses/ExecuteForbidden" }
        "409": { $ref: "#/components/responses/ExecuteConflict" }
        "504": { $ref: "#/components/responses/ExecuteIndeterminate" }
        "503":
          description: CONNECTOR_DISABLED or CONNECTOR_NOT_CONFIGURED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /execute:
    post:
      operationId: execute
      summary: Execute any connector operation through Authority
      tags: [connectors]
      x-status: stable
      description: >
        The generic counterpart to `/github/execute`: dispatches by the
        authorized tool's provider prefix (`stripe.*`, `gmail.*`, `slack.*`,
        `postgres.*`, or a tenant's own `custom_<connectionId>.*` operations,
        one opaque provider id per Custom API connection) to whichever
        `AuthorityConnector` is registered for that prefix
        (`src/lib/connectors/registry.ts`), through the same
        reserve -> dispatch -> settle -> receipt lifecycle `/github/execute`
        uses, generalized in `gateway.reserve_connector_execution` and its
        siblings. Returns `501 OPERATION_NOT_SUPPORTED` for any tool whose
        provider has no connector registered (today: Custom API, Stripe,
        Gmail, Slack, and PostgreSQL are registered here). `github.*` tools
        are deliberately NOT reachable through this path — they remain at
        their own dedicated `/github/execute` route, with its own executor
        and GitHub-specific failure codes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExecuteSucceeded" }
        "403": { $ref: "#/components/responses/ExecuteForbidden" }
        "409": { $ref: "#/components/responses/ExecuteConflict" }
        "504": { $ref: "#/components/responses/ExecuteIndeterminate" }
        "501":
          description: The tool's connector is not yet implemented against this contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /approvals/{id}:
    get:
      operationId: getApproval
      summary: Poll a pending approval's status
      tags: [approvals]
      x-status: stable
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: >
            State only — never approver identity, notes, or evidence. Only
            the requesting agent's own approvals are visible; others 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalStatus" }
        "404": { $ref: "#/components/responses/ApprovalNotFound" }

  /sessions:
    post:
      operationId: createSession
      summary: Establish a task-bound session
      tags: [sessions]
      x-status: stable
      description: |
        Exchanges the calling agent credential for a short-lived token bound
        to one task and its currently active contract version. A session
        grants no tool authority by itself — every call made while holding
        one still goes through `/authorize` and `/execute` (or
        `/github/execute`), checked exactly as a direct credential would be.
        Maximum lifetime is 15 minutes regardless of `ttlSeconds` requested.
        Only the token hash is stored; the plaintext is returned once, here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              additionalProperties: false
              properties:
                taskId: { type: string, format: uuid }
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 900
                  default: 900
      responses:
        "200":
          description: The session token, returned exactly once.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, token, taskId, contract, expiresAt]
                properties:
                  sessionId: { type: string, format: uuid }
                  token:
                    type: string
                    pattern: "^authority_ts_"
                    description: Opaque. Shown only in this response; only its hash is ever stored.
                  taskId: { type: string, format: uuid }
                  contract:
                    type: object
                    required: [id, version]
                    properties:
                      id: { type: string, format: uuid }
                      version: { type: integer }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409":
          description: NO_ACTIVE_CONTRACT — a session cannot be established for a task with no currently active contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Introspect the presented session token
      tags: [sessions]
      x-status: stable
      description: |
        Unlike every other endpoint, this one gives a specific, typed reason
        a session is no longer usable (expired, revoked, or its issuing
        credential/agent is no longer active) rather than the single
        collapsed `UNAUTHENTICATED` used elsewhere — it exists specifically
        so a client can tell these apart.
      security:
        - taskSession: []
      responses:
        "200":
          description: The session is live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  taskId: { type: string, format: uuid }
                  agentId: { type: string, format: uuid }
                  contract:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      version: { type: integer }
                  expiresAt: { type: string, format: date-time }
        "401":
          description: SESSION_NOT_FOUND, SESSION_REVOKED, SESSION_EXPIRED, or SESSION_CREDENTIAL_REVOKED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /sessions/revoke:
    post:
      operationId: revokeSession
      summary: End the presented session early
      tags: [sessions]
      x-status: stable
      description: |
        Self-revocation, authenticated by the session token itself — the
        same "you hold it, you can end it" shape as revoking a capability.
        Idempotent; an empty body is fine.
      security:
        - taskSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Revoked (idempotent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [ok, already_revoked] }
        "404": { description: Unknown session. }

  /tasks/{taskId}/tools:
    get:
      operationId: listTaskTools
      summary: Fetch the contract-filtered tool manifest for a task
      tags: [manifests]
      x-status: stable
      description: |
        Exposes only operations in the task's currently active contract —
        never the full registry, and never a stale manifest for a contract
        that has since expired, been revoked, or been superseded. Listing a
        tool here grants nothing by itself; `/authorize` independently
        checks every call regardless of what this returned.
      security:
        - agentCredential: []
        - taskSession: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolManifest" }
        "403":
          description: AGENT_TASK_MISMATCH — a session presented for a different task than it was issued for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/TaskNotFound" }
        "409":
          description: NO_ACTIVE_CONTRACT — never falls back to the full registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /customers:
    post:
      operationId: createOrResolveCustomer
      summary: Create or resolve an external customer
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        Your own backend calls this with the external id it already uses for
        this person in your own system — never email, never anything your
        agent or an end user supplies directly. Idempotent: calling this
        again with the same external id always resolves the same customer,
        never creates a second one. The resulting customer is scoped to the
        application your backend credential belongs to; it is never visible
        to, or creatable by, a different application in the same tenant.

        This customer never needs, and cannot be given, an Authority
        dashboard login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId]
              additionalProperties: false
              properties:
                externalId: { type: string, minLength: 1, maxLength: 200 }
                displayLabel: { type: string, maxLength: 200 }
                metadata: { type: object }
      responses:
        "200":
          description: An existing customer, resolved by external id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "201":
          description: A new customer was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /customers/{customerId}/connections:
    get:
      operationId: listCustomerConnections
      summary: List one customer's usable connections
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        Connections this customer owns directly, plus any organization-owned
        connection currently delegated to them. Never another customer's
        connections, even within the same application or tenant.
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The customer's connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: CUSTOMER_NOT_FOUND — unknown, or belongs to a different application. }

  /customers/{customerId}/connections/broker:
    post:
      operationId: registerBrokerConnection
      summary: Register an existing, broker-managed connection (Mode B)
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        For an application that already manages its own provider OAuth
        client and token storage. No token or secret is accepted here —
        Authority asks the registered broker (dashboard Settings →
        application → connection brokers) for a short-lived access token at
        execution time, every time, and never stores one locally for this
        connection. `brokerConnectionRef` is whatever identifier your own
        broker endpoint needs to find the right account; Authority never
        interprets it.
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId, brokerId, brokerConnectionRef, verifiedAccountRef]
              additionalProperties: false
              properties:
                connectorId: { type: string, minLength: 1, maxLength: 64 }
                brokerId: { type: string, format: uuid }
                brokerConnectionRef: { type: string, minLength: 1, maxLength: 200 }
                verifiedAccountRef:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The account identity your own backend has already verified (e.g. an email address).
      responses:
        "201":
          description: The registered connection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectionId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: CUSTOMER_NOT_FOUND or broker not found for this application. }

  /customers/{customerId}/tasks:
    post:
      operationId: createCustomerTask
      summary: Create a customer-scoped task with explicit connections
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        Creates the task row and pins every requested connector binding
        atomically, before any contract compilation or activation can see
        it. Every connectionId must already belong to this exact customer,
        or be an organization connection explicitly delegated to them — a
        request naming a connection this customer cannot use fails the
        whole call, and no task is created half-bound. Compiling, proposing
        and activating the task's authority contract, and starting the
        agent's own task session, remain the existing dashboard/runtime
        workflows, unchanged by this endpoint.
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, intent]
              additionalProperties: false
              properties:
                agentId: { type: string, format: uuid }
                intent: { type: string, minLength: 1, maxLength: 4000 }
                connections:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [connectorId, connectionId]
                    properties:
                      connectorId: { type: string }
                      connectionId: { type: string, format: uuid }
                idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: An existing task, resolved by idempotency key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerTaskCreated" }
        "201":
          description: A new task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerTaskCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          {
            description: CONNECTION_NOT_USABLE_BY_CUSTOMER — a named connection does not belong to,
            or is not delegated to,
            this customer.,
          }
        "404": { description: CUSTOMER_NOT_FOUND or AGENT_NOT_FOUND. }

  /tasks/{taskId}/prepare:
    post:
      operationId: prepareTask
      summary: Submit a candidate plan and attempt to get a running contract
      tags: [tasks]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        Runs the identical validate -> solve -> compile -> derive-approvals
        -> verify pipeline the dashboard's "propose contract" action runs
        (never a second, divergent authorization engine), persists the
        result, then attempts automatic activation. The contract activates
        unless one of the organization's approval rules matched (status
        `awaiting_approval`) or enforced task alignment did not clear the plan
        (status `alignment_review`). Neither ever widens what the compiler
        decided, and the caller cannot supply a risk label.

        Always responds `200` with a discriminated `status` on success:
        `awaiting_approval` and `clarification` are expected, common
        outcomes, never errors. Set `generate: true` instead of `plan` for
        an AI-drafted candidate plan — this returns `ai_unavailable`
        (not a silent mock) when no model credentials are configured.
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan: { $ref: "#/components/schemas/CandidatePlan" }
                generate: { type: boolean, description: "Mutually exclusive with `plan`." }
                idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
                raiseBudgets:
                  type: boolean
                  description: >-
                    Renew the task-wide budgets of this contract's actions when it activates: each becomes the task's
                    use so far plus the action's maxInvocations. Otherwise they are inherited from earlier versions.
      responses:
        "200":
          description: A typed outcome — see the five variants below.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrepareTaskOutcome" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: TASK_NOT_FOUND. }

  /tasks/{taskId}/content:
    post:
      operationId: inspectContent
      summary: Optionally screen external content before your model sees it
      tags: [alignment]
      x-status: stable
      security:
        - backendCredential: []
        - agentCredential: []
      description: |
        Optional. Submit text you fetched (email, web page, document, database
        or API text, memory) with the backend key or the task's session. Source
        fields are descriptive only and unknown fields are rejected -- nothing
        here can mark content as a trusted instruction. With screening off the
        response is `status: not_inspected` (`screening.ran: false`) and the
        content is returned unchanged; that is never a pass.
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, source]
              properties:
                content: { type: string, maxLength: 140000 }
                contentType:
                  { type: string, enum: [text/plain, text/markdown, application/json], default: text/plain }
                source:
                  type: object
                  additionalProperties: false
                  required: [kind]
                  properties:
                    kind:
                      {
                        type: string,
                        enum: [web, document, email, slack, database, api, memory, tool_result, other],
                      }
                    label: { type: string, maxLength: 200 }
                    uri: { type: string, maxLength: 500 }
                    toolName: { type: string, maxLength: 100 }
                    toolArgs: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The inspection result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentInspection" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "TASK_SESSION_REQUIRED or AGENT_TASK_MISMATCH." }
        "404": { description: TASK_NOT_FOUND. }

  /content/{inspectionId}:
    get:
      operationId: getContentInspection
      summary: Status of an inspection; held content only after an administrator approved it
      tags: [alignment]
      x-status: stable
      security:
        - backendCredential: []
        - agentCredential: []
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  inspectionId: { type: string, format: uuid }
                  taskId: { type: string, format: uuid }
                  status: { type: string }
                  decision: { type: string, enum: [approved, rejected], nullable: true }
                  contentHash: { type: string }
                  contextRevision: { type: integer }
                  findings: { type: array, items: { $ref: "#/components/schemas/AlignmentFinding" } }
                  data: { type: object, nullable: true }
        "404": { description: NOT_FOUND. }

  /tasks/{taskId}/objectives:
    post:
      operationId: reviseObjectives
      summary: Record that the user changed what they want (backend key only)
      tags: [alignment]
      x-status: stable
      security:
        - backendCredential: []
      description: Agents, tool results and external content can never revise objectives. Re-prepare afterwards.
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                request: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "200":
          description: The new objectives version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string, format: uuid }
                  version: { type: integer }
                  taskInstructions: { type: array, items: { type: string } }
                  prohibitions: { type: array, items: { type: string } }
                  requirements: { type: array, items: { type: object } }
        "403": { description: "BACKEND_KEY_REQUIRED." }
        "409": { description: "ALIGNMENT_DISABLED or STALE." }
        "503": { description: "REVIEWER_UNAVAILABLE -- nothing was recorded." }

  /contracts/{contractId}:
    get:
      operationId: getContractStatus
      summary: Read a contract's current status
      tags: [tasks]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        For a contract left `awaiting_approval` by /tasks/{taskId}/prepare,
        poll this until `status` becomes `active` (a human activated it on
        the dashboard) or `rejected`.
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: NOT_FOUND. }

  /connections/sessions:
    post:
      operationId: createConnectionSession
      summary: Open an embedded connection session (Mode A)
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        For an application with no existing provider connection to reuse.
        Returns an opaque URL your backend redirects the customer's browser
        to — they authorize the provider directly; they never see or need
        an Authority credential. `returnUrl` must exactly match one already
        registered on your application (dashboard Settings → application);
        it is never a pattern, so this can never become an open redirect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, connectorId, returnUrl]
              additionalProperties: false
              properties:
                customerId: { type: string, format: uuid }
                connectorId: { type: string, minLength: 1, maxLength: 64 }
                returnUrl: { type: string, format: uri }
      responses:
        "201":
          description: The session was opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  url:
                    type: string
                    description: Path to redirect the customer's browser to. Relative to your Authority deployment's own origin.
                  expiresAt: { type: string, format: date-time }
        "400": { description: RETURN_URL_NOT_ALLOWED — not registered on this application. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: CUSTOMER_NOT_FOUND. }

  /connections/sessions/{sessionId}:
    get:
      operationId: getConnectionSessionStatus
      summary: Read connection-session status
      tags: [customers]
      x-status: stable
      security:
        - backendCredential: []
      description: |
        Poll this after redirecting the customer back, to find out whether
        the connection actually completed and, if so, which connection id
        was created. Scoped to your own application — one application's
        backend can never read another application's session status even
        within the same tenant.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The session's current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, completed, expired, cancelled, denied] }
                  connectorId: { type: string }
                  connectionId: { type: string, nullable: true }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Unknown session for this application. }

components:
  securitySchemes:
    agentCredential:
      type: http
      scheme: bearer
      bearerFormat: "authority_rk_<64 hex chars>"
      description: Identifies a registered agent. No Supabase session is involved.
    taskSession:
      type: http
      scheme: bearer
      bearerFormat: "authority_ts_<opaque>"
      description: >
        An optional, short-lived stand-in for an agent credential, bound to
        one task and contract version. Grants no tool authority by itself;
        accepted anywhere an agent credential is, for that one task.
    backendCredential:
      type: http
      scheme: bearer
      bearerFormat: "authority_dk_<64 hex chars>"
      description: >
        Server-side-only: your own application backend, never an agent,
        browser, or end user. Authenticates the `/customers` and
        `/connections/sessions` developer API only — it is never accepted
        on `/authorize`, `/execute`, or anywhere an agent credential or task
        session is, and the reverse is also true.

  headers:
    XRequestId:
      schema: { type: string, format: uuid }
      description: Echoed on every response, success or failure, for correlation. Never a token or payload.

  schemas:
    ArgumentValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: { type: string }

    AuthorizeRequest:
      type: object
      required: [taskId, tool, operation, idempotencyKey]
      additionalProperties: false
      properties:
        taskId: { type: string, format: uuid }
        tool: { type: string, pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$" }
        operation: { type: string, minLength: 1, maxLength: 100 }
        resource: { type: string, minLength: 1, maxLength: 200 }
        arguments:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ArgumentValue" }
          default: {}
        planNodeId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        maxUses: { type: integer, minimum: 1, maximum: 5, default: 1 }
        executionContext:
          type: object
          description: Validated and never stored.

    AuthorizeResponse:
      type: object
      required:
        - decisionId
        - status
        - reasonCodes
        - summary
        - requiresApproval
        - requiresClarification
        - requiresReplan
        - wasReplayed
        - enforcement
        - guidance
        - simulation
      properties:
        decisionId: { type: string, format: uuid }
        status:
          type: string
          enum: [allow, allow_constrained, replan, clarify, require_approval, deny]
        reasonCodes:
          type: array
          items:
            type: string
            enum:
              - TASK_NOT_EXECUTABLE
              - NO_ACTIVE_CONTRACT
              - CONTRACT_NOT_CURRENTLY_ACTIVE
              - UNSUPPORTED_CONTRACT_VERSION
              - FORBIDDEN_RESOURCE
              - FORBIDDEN_OPERATION
              - TOOL_NOT_IN_CONTRACT
              - ARGUMENTS_UNDERSPECIFIED
              - CONSTRAINT_VIOLATION
              - INVOCATION_LIMIT_REACHED
              - WITHIN_CONTRACT
              - SECURITY_POLICY_DENIED
              - APPROVAL_REQUIRED_BY_POLICY
              - SECURITY_REVIEW_UNAVAILABLE
              - TASK_ALIGNMENT_MISALIGNED
              - TASK_ALIGNMENT_HELD
              - TASK_ALIGNMENT_UNREVIEWED
        summary: { type: string }
        checks:
          type: object
          description: Which optional checks ran for this call. `not_run` is never a pass.
          properties:
            taskAlignment:
              { type: string, enum: [not_run, shadow, passed, covered_by_plan_review, stopped, held] }
        alignment:
          description: Present only when task alignment stopped (deny) or held (require_approval) the call before any authorization was committed.
          type: object
          properties:
            reviewId: { type: string, format: uuid, nullable: true }
            outcome: { type: string, enum: [misaligned, ambiguous, unreviewed] }
            policy: { type: string }
            findings: { type: array, items: { $ref: "#/components/schemas/AlignmentFinding" } }
            feedback: { type: string, nullable: true }
        contract:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
        remainingInvocations: { type: integer, nullable: true }
        requiresApproval: { type: boolean }
        requiresClarification: { type: boolean }
        requiresReplan: { type: boolean }
        wasReplayed: { type: boolean }
        enforcement:
          type: object
          required: [mode, degraded, narrowedBySecurityPolicy]
          properties:
            mode: { type: string, enum: [off, shadow, enforce] }
            degraded: { type: boolean }
            narrowedBySecurityPolicy: { type: boolean }
        capability:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Capability" }]
        approval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ApprovalStatus" }]
        guidance: { $ref: "#/components/schemas/Guidance" }
        simulation:
          type: boolean
          description: false only for tools with a real connector (currently github.*).

    Capability:
      type: object
      required: [id, tokenAlreadyIssued, tool, operation, expiresAt, maxUses]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          nullable: true
          pattern: "^authcap_v1_"
          description: Present only in the response that issued it; never re-shown on replay.
        tokenAlreadyIssued: { type: boolean }
        tool: { type: string }
        operation: { type: string }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }

    Guidance:
      type: object
      required: [nextStep, message]
      description: Tells an agent how to recover from a refusal. Never grants anything.
      properties:
        nextStep:
          type: string
          enum: [proceed, replan, clarify, request_approval, retry_later, stop]
        message: { type: string }

    ApprovalStatus:
      type: object
      required: [approvalId, state]
      properties:
        approvalId: { type: string, format: uuid, nullable: true }
        state:
          type: string
          enum: [pending, approved, rejected, expired, stale, consumed]
        requiredApprovals: { type: integer, nullable: true }
        approvals: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        statusUrl: { type: string }

    ConsumeCapabilityRequest:
      type: object
      required: [capability, tool, operation, idempotencyKey]
      additionalProperties: false
      properties:
        capability: { type: string, minLength: 1, maxLength: 200 }
        tool: { type: string }
        operation: { type: string }
        resource: { type: string, minLength: 1, maxLength: 200 }
        arguments:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ArgumentValue" }
          default: {}
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }

    ConsumeCapabilityResponse:
      type: object
      required: [result, capabilityId, remainingUses, expiresAt, replayed, simulated, message]
      properties:
        result: { const: accepted }
        capabilityId: { type: string, format: uuid }
        remainingUses: { type: integer }
        expiresAt: { type: string, format: date-time }
        replayed: { type: boolean }
        simulated: { const: true }
        message: { const: "SIMULATED — no external tool was executed." }

    ExecuteRequest:
      type: object
      required: [capability, tool, operation, resource, idempotencyKey]
      additionalProperties: false
      properties:
        capability: { type: string, minLength: 1, maxLength: 200 }
        tool: { type: string }
        operation: { type: string }
        resource: { type: string, minLength: 1, maxLength: 200 }
        arguments:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ArgumentValue" }
          default: {}
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }

    ExecuteReceipt:
      type: object
      required: [result, executionId, receiptId, execution, resource]
      properties:
        result: { type: string, enum: [succeeded, succeeded_noop] }
        executionId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        execution:
          type: object
          required: [mode, simulated]
          properties:
            mode: { type: string, enum: [mock, live] }
            simulated: { type: boolean }
        resource: { type: string }
        data:
          type: object
          nullable: true
          description: Connector-specific, redacted, size-bounded response projection. null when delivery is held.
        delivery:
          type: string
          enum: [delivered, held]
          description: "held: the action RAN (see receiptId) but its result is withheld for review -- never execute it again."
        inspection:
          type: object
          description: "Present when the application screens results. status not_inspected (ran: false) when screening did not run."
          properties:
            status: { type: string }
            ran: { type: boolean }
            action: { type: string, enum: [report, quarantine, shadow] }
            inspectionId: { type: string, format: uuid, nullable: true }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, reason, message, requestId]
          properties:
            code: { type: string }
            reason: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }

    CustomerCreated:
      type: object
      required: [customerId, wasCreated]
      properties:
        customerId: { type: string, format: uuid }
        wasCreated: { type: boolean }

    CustomerConnection:
      type: object
      required: [connectionId, connectorId, status, ownerKind, createdAt]
      properties:
        connectionId: { type: string, format: uuid }
        connectorId: { type: string }
        status: { type: string }
        ownerKind: { type: string, enum: [organization, customer] }
        verifiedAccountRef:
          type: string
          nullable: true
          description: The provider's own account identity, once verified (e.g. an email address).
        createdAt: { type: string, format: date-time }

    CustomerTaskCreated:
      type: object
      required: [taskId, wasCreated]
      properties:
        taskId: { type: string, format: uuid }
        wasCreated: { type: boolean }

    CandidatePlanNode:
      type: object
      required: [id, sequence, tool, arguments, expectedSideEffect]
      properties:
        id: { type: string, description: Caller-assigned, unique within this plan — not a database id. }
        sequence: { type: integer, minimum: 0 }
        tool: { type: string }
        arguments: { type: object }
        resourceBinding: { type: string }
        dependencies: { type: array, items: { type: string } }
        declaredOutputs: { type: array, items: { type: string } }
        dataFlowRefs:
          type: array
          description: >-
            Fill an argument from an earlier step's declared output. Allowed only for free-text fields (message
            text, subject, title, description); Authority neither verifies where the value came from nor constrains
            it at runtime. A reference to any other field (recipient, channel, id, path, branch, amount) excludes the
            step with status `replan`.
          items:
            type: object
            properties:
              argumentKey: { type: string }
              fromNodeId: { type: string }
              output: { type: string }
        expectedSideEffect: { type: string, enum: [read, write_create, write_update, write_delete, admin] }
        maxInvocations: { type: integer, minimum: 1, maximum: 20 }

    CandidatePlan:
      type: object
      required: [schemaVersion, nodes]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        nodes:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/CandidatePlanNode" }

    PrepareTaskOutcome:
      type: object
      description: >
        A discriminated union on `status`. `taskId` is always present;
        the remaining fields depend on which variant this is.
      required: [taskId, status]
      properties:
        taskId: { type: string, format: uuid }
        status:
          type: string
          enum: [ready, awaiting_approval, alignment_review, clarification, rejected, ai_unavailable]
        contractId:
          {
            type: string,
            format: uuid,
            description: "Present for: ready, awaiting_approval, alignment_review.",
          }
        version: { type: integer, description: "Present for: ready, awaiting_approval, alignment_review." }
        tools:
          type: array
          items: { type: string }
          description: "Present for: ready — every tool the now-active contract allows."
        excludedSteps:
          type: array
          description: >-
            Present for: ready, awaiting_approval, alignment_review (and inside `details` of the clarification
            "no plan node was accepted"). Submitted steps that are not in the contract, with the validator's reasons.
            A contract can be `ready` while a step you submitted is missing; check this list.
          items:
            type: object
            required: [nodeId, tool, status, reasons]
            properties:
              nodeId: { type: string }
              tool: { type: string }
              status: { type: string, enum: [denied, clarify, replan] }
              reasons: { type: array, items: { type: string } }
        approvalPath:
          type: string
          description: "Present for: awaiting_approval — an approval rule matched; a person approves on the dashboard."
        decision:
          type: string
          enum: [revise, hold]
          description: "Present for: alignment_review — revise the plan, or wait for a person."
        reviewPath: { type: string, description: "Present for: alignment_review." }
        alignment: { $ref: "#/components/schemas/PlanAlignment" }
        checks:
          type: object
          description: Which optional checks ran. `not_run` is never a pass.
          properties:
            planReview: { type: string, enum: [ran, not_run] }
        budgets:
          type: string
          enum: [inherited, raised, raise_on_activation]
          description: >-
            Present for: ready, awaiting_approval, alignment_review. Task-wide budgets: `inherited` (this contract
            draws on what earlier versions of the task used), `raised` (raiseBudgets was applied at activation),
            `raise_on_activation` (applied when a person activates the contract).
        reason: { type: string, description: "Present for: clarification, rejected." }
        details:
          description: >-
            Present for: clarification -- the generated plan when it came from `generate: true`, or
            `{ excludedSteps }` when no submitted step could be compiled.

    AlignmentFinding:
      type: object
      required: [type, source, severity, explanation]
      properties:
        type:
          {
            type: string,
            description: "e.g. wrong_recipient, wrong_amount, unresolved_value, misaligned_instruction, injected_directive, reviewer_unavailable",
          }
        source: { type: string, enum: [deterministic, semantic, task_shield, inspection] }
        severity: { type: string, enum: [conflict, ambiguous, unreviewed, info] }
        stepId: { type: string }
        field: { type: string }
        value: { type: string }
        explanation: { type: string }

    PlanAlignment:
      type: object
      description: Present when the application has plan checks on. Model-based findings are judgments, not certainties.
      properties:
        mode: { type: string, enum: [shadow, enforce] }
        policy: { type: string, enum: [reference, production] }
        outcome: { type: string, enum: [aligned, misaligned, ambiguous, unreviewed] }
        decision: { type: string, enum: [approved, rejected], nullable: true }
        reviewId: { type: string, format: uuid, nullable: true }
        findings: { type: array, items: { $ref: "#/components/schemas/AlignmentFinding" } }
        feedback: { type: string, nullable: true }

    ContentInspection:
      type: object
      required: [taskId, status, screening]
      properties:
        taskId: { type: string, format: uuid }
        inspectionId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [not_inspected, passed, flagged, quarantined, held, unreviewed]
          description: "`not_inspected` means screening did not run -- never a pass."
        mode: { type: string, enum: [off, shadow, enforce] }
        policy: { type: string, enum: [reference, production] }
        contentHash: { type: string, nullable: true }
        contextRevision: { type: integer, nullable: true }
        screening:
          type: object
          required: [ran, action]
          properties:
            ran: { type: boolean }
            reason: { type: string, enum: [alignment_off, content_screening_off] }
            action: { type: string, enum: [report, quarantine, shadow, none] }
        findings: { type: array, items: { $ref: "#/components/schemas/AlignmentFinding" } }
        feedback: { type: string, nullable: true }
        data:
          nullable: true
          description: What may go to the model, always as external data; null when quarantine withheld it.
          type: object
          properties:
            role: { const: external_data }
            source: { type: object }
            text: { type: string }

    ContractStatus:
      type: object
      required: [contractId, taskId, status, tools, requiredApprovalsCount]
      properties:
        contractId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        status: { type: string, enum: [proposed, awaiting_approval, active, superseded, revoked, rejected] }
        tools: { type: array, items: { type: string } }
        requiredApprovalsCount: { type: integer }

    ToolManifest:
      type: object
      required: [taskId, contract, versions, manifestHash, tools]
      properties:
        taskId: { type: string, format: uuid }
        contract:
          type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
        versions:
          type: object
          description: The registry and compiler versions this manifest was computed against.
          properties:
            registry: { type: string }
            compiler: { type: string }
        manifestHash:
          type: string
          description: Changes whenever the contract, registry, or tool set changes — cheap to compare before re-fetching.
        tools:
          type: array
          items: { $ref: "#/components/schemas/ManifestTool" }

    ManifestTool:
      type: object
      required: [tool, description, inputSchema, resourceConstraints, maxInvocations, requiresApproval]
      description: >
        Descriptions and schemas come only from published trusted
        definitions — never credentials, internal policy text, provider
        prompts, other tenants' data, or model reasoning.
      properties:
        tool:
          type: string
          description: The operation identifier — pass this as-is to /authorize.
        description: { type: string }
        inputSchema:
          type: object
          description: Standard JSON Schema for this operation's arguments.
        resourceConstraints:
          type: array
          description: This contract's own constraints on the operation (e.g. pinned to one resource).
          items:
            type: object
            properties:
              key: { type: string }
              equals: { type: string }
              matches: { type: string }
        maxInvocations:
          type: integer
          nullable: true
          description: The budget this contract version set for the action, if any. See remainingInvocations.
        remainingInvocations:
          type: integer
          nullable: true
          description: >-
            Uses left now: the lower of this contract version's remainder and the task-wide remainder, which also
            counts use under earlier versions of the task. null when the action has no budget yet.
        openArguments:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            The unpinned arguments this action accepts (free text the plan left open). /authorize refuses any
            argument that is neither pinned in resourceConstraints nor listed here. null for a contract compiled
            before closed-world arguments, which accepts extra keys.
        requiresApproval: { type: boolean }

  responses:
    InvalidRequest:
      description: INVALID_REQUEST — field paths only, never values.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: UNAUTHENTICATED — missing, invalid, or revoked key (deliberately identical).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AgentTaskMismatch:
      description: AGENT_TASK_MISMATCH — the key's agent is not the task's agent (or a session used for another task); TASK_SESSION_REQUIRED — the application requires task sessions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TaskNotFound:
      description: TASK_NOT_FOUND — also returned for another tenant's task.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    IdempotencyConflict:
      description: IDEMPOTENCY_CONFLICT — same key, different call.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: RATE_LIMITED — 20+ failed attempts for a key prefix in 60s.
      headers:
        Retry-After: { schema: { type: integer, const: 60 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GatewayUnavailable:
      description: GATEWAY_UNAVAILABLE — fails closed.
      headers:
        Retry-After: { schema: { type: integer, const: 5 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ScopeMismatch:
      description: SCOPE_MISMATCH — different tool, operation, resource, or arguments than issued.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CapabilityNotFound:
      description: CAPABILITY_NOT_FOUND — unknown, or another agent's/tenant's (indistinguishable).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CapabilityConflict:
      description: CAPABILITY_ALREADY_USED | CAPABILITY_EXPIRED | CAPABILITY_REVOKED | CONTRACT_NO_LONGER_ACTIVE | TASK_NO_LONGER_EXECUTABLE | AGENT_OR_KEY_REVOKED | IDEMPOTENCY_CONFLICT.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ApprovalNotFound:
      description: APPROVAL_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ExecuteSucceeded:
      description: The connector call completed (possibly a no-op), or this is a replay of an already-finished execution.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ExecuteReceipt"
              - type: object
                required: [replayed, status, receipt]
                properties:
                  replayed: { const: true }
                  status: { type: string }
                  receipt: { type: object }
    ExecuteForbidden:
      description: REPOSITORY_NOT_BOUND | REPOSITORY_NOT_ALLOWED | INSTALLATION_UNAVAILABLE | SCOPE_MISMATCH (connector-specific equivalents for non-GitHub connectors).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ExecuteConflict:
      description: EXECUTION_IN_PROGRESS | CAPABILITY_ALREADY_USED | CAPABILITY_REVOKED | CAPABILITY_EXPIRED | IDEMPOTENCY_CONFLICT. A "released" status means nothing was sent and the use was returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ExecuteIndeterminate:
      description: >
        EXECUTION_INDETERMINATE — the write's outcome is unknown (e.g. a
        timeout after dispatch). Never retried automatically by Authority;
        the capability's use is spent and the execution is queued for lazy
        reconciliation or human resolution.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
